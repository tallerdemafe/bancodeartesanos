<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Taller de Mafe | Portal de Artesanos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        script: ['Great Vibes', 'cursive'],
                    },
                    colors: {
                        brand: {
                            50: '#fbf9f4',
                            100: '#f5efe4',
                            200: '#e8d8bd',
                            300: '#d9bf91',
                            400: '#d6b06b',
                            500: '#cca566',
                            600: '#b08b4a',
                            700: '#8c6b34',
                            800: '#6b4f24',
                            900: '#4a3516',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fbf9f4; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fbf9f4; }
        ::-webkit-scrollbar-thumb { background: #d6b06b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b08b4a; }
    </style>
</head>
<body class="text-brand-900 font-sans min-h-screen flex flex-col">

    <!-- Navegación -->
    <nav class="glass-panel sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <span class="font-serif font-bold text-4xl text-brand-600 mr-1">T</span>
                    <span class="font-serif font-bold text-4xl text-brand-600 mr-2">M</span>
                    <div class="flex flex-col justify-center -space-y-1">
                        <span class="font-script text-3xl text-brand-700 pt-2">El Taller de Mafe</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4" id="nav-links">
                    <!-- El botón de login/logout se carga dinámicamente aquí -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal Dinámico -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex justify-center items-center h-64">
            <i class="fa-solid fa-circle-notch fa-spin text-brand-50 text-4xl"></i>
        </div>
    </main>

    <footer class="bg-brand-900 text-brand-100 py-8 mt-auto border-t-[6px] border-brand-500">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="font-script text-3xl mb-2 text-brand-400">"Tienda de Accesorios"</p>
            <p class="text-sm opacity-70 font-sans tracking-wide">&copy; 2026 El Taller de Mafe. Since 2015.</p>
        </div>
    </footer>

    <!-- MODAL DE INICIO DE SESIÓN SEGURO -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex justify-center items-center">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all border border-brand-200">
            <div class="text-center mb-6">
                <span class="font-script text-4xl text-brand-700 block mb-1">Área Privada</span>
                <p class="text-xs text-gray-500">Ingreso exclusivo para administración y artesanos activos</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Selecciona tu Rol</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border-2 border-brand-200 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-brand-50 transition" id="label-role-artisan">
                            <input type="radio" name="login-role" value="artisan" checked onchange="toggleLoginFields('artisan')" class="sr-only">
                            <i class="fa-solid fa-hammer text-brand-600 text-xl mb-1"></i>
                            <span class="text-xs font-semibold">Artesano</span>
                        </label>
                        <label class="border-2 border-gray-100 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-brand-50 transition" id="label-role-admin">
                            <input type="radio" name="login-role" value="admin" onchange="toggleLoginFields('admin')" class="sr-only">
                            <i class="fa-solid fa-crown text-gray-400 text-xl mb-1"></i>
                            <span class="text-xs font-semibold">Administrador</span>
                        </label>
                    </div>
                </div>

                <!-- Campo dinámico para Artesano -->
                <div id="login-field-email">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Correo Registrado *</label>
                    <input type="email" id="login-email" placeholder="ejemplo@gmail.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                </div>

                <!-- Campo dinámico para Administrador (oculto inicialmente) -->
                <div id="login-field-password" class="hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Contraseña de Mafe *</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition">Cancelar</button>
                    <button type="submit" class="bg-brand-700 hover:bg-brand-800 text-white px-5 py-2 rounded-lg text-sm font-semibold transition shadow">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Alertas -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 transform transition-all">
            <h3 id="modal-title" class="text-xl font-serif font-bold text-brand-800 mb-2">Mensaje</h3>
            <p id="modal-message" class="text-gray-600 text-sm mb-6 whitespace-pre-line"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg font-medium transition">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SEGURIDAD Y ACCESO REAL
        // ==========================================
        // Reemplaza esta URL con la que te da Google Apps Script al publicar (Paso 4 de la guía)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ffugSrzp9CPC1MNzxe9K30gM_dWO4dsHuvilBJyBHK--TpCBaMkxHNXn5h3C5WVOCQ/exec"; 
        
        // 🔒 CONTRASEÑA SECRETA DEL ADMINISTRADOR (Cámbiala por la que gustes)
        const ADMIN_PASSWORD = "mafe_admin_taller"; 

        let currentRole = 'public'; // 'public', 'artisan', 'admin'
        let globalData = { applications: [], videos: [], activities: [] };
        let activeUserEmail = ""; // Guarda el correo del artesano que inició sesión

        // Datos de simulación para que la web funcione de inmediato sin Sheets conectado
        let simulatedData = {
            applications: [
                { id: "s1", name: "María Camila", email: "artesano@taller.com", phone: "+57 300 1234567", portfolio: "https://instagram.com/mis_accesorios", q1: "Sí, sé hacer alambrismo básico.", q2: "Me encanta ver cómo un metal se vuelve arte.", q3: "Abierta al 100%, me gusta perfeccionar mis acabados.", q4: "Porque admiro el estilo de El Taller de Mafe", availType: "Media Jornada", availDetails: "Tardes de Lunes a Viernes", status: "Aprobado" },
                { id: "s2", name: "Andrés Felipe", email: "pendiente@taller.com", phone: "+57 311 9876543", portfolio: "", q1: "No tengo experiencia pero sé tejer macramé.", q2: "Me relaja y me apasiona la precisión.", q3: "Acepto comentarios para mejorar mis técnicas.", q4: "Quiero aprender de los mejores", availType: "Completa", availDetails: "Disponibilidad inmediata", status: "Pendiente" }
            ],
            videos: [
                { title: "Técnica Básica: Nudo Plano de Macramé", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" },
                { title: "Introducción al Alambrismo Fino", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" }
            ],
            activities: [
                { title: "Primer Reto: Pulsera Ajustable", instructions: "Realiza una pulsera ajustable utilizando hilo chino de 1mm y la técnica de nudo plano que aprendiste en el primer video. Toma una foto nítida de los acabados y ten listo el enlace para mostrarlo." }
            ]
        };

        window.onload = () => {
            if(SCRIPT_URL === "TU_URL_DE_APPS_SCRIPT_AQUI") {
                globalData = simulatedData;
                renderApp();
            } else {
                renderApp();
                fetchAllData(); // Descarga los datos de Sheets en segundo plano
            }
        };

        window.showModal = function(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        };

        // --- SISTEMA DE LOGIN MODAL ---
        window.openLoginModal = function() {
            document.getElementById('login-modal').classList.remove('hidden');
            // Resetear visualmente
            toggleLoginFields('artisan');
            document.getElementById('login-form').reset();
        };

        window.closeLoginModal = function() {
            document.getElementById('login-modal').classList.add('hidden');
        };

        window.toggleLoginFields = function(role) {
            const fieldEmail = document.getElementById('login-field-email');
            const fieldPassword = document.getElementById('login-field-password');
            const lblArtisan = document.getElementById('label-role-artisan');
            const lblAdmin = document.getElementById('label-role-admin');

            if(role === 'admin') {
                fieldEmail.classList.add('hidden');
                fieldPassword.classList.remove('hidden');
                lblAdmin.className = "border-2 border-brand-500 bg-brand-50 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer transition";
                lblArtisan.className = "border-2 border-gray-100 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-brand-50 transition";
            } else {
                fieldEmail.classList.remove('hidden');
                fieldPassword.classList.add('hidden');
                lblArtisan.className = "border-2 border-brand-500 bg-brand-50 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer transition";
                lblAdmin.className = "border-2 border-gray-100 rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer hover:bg-brand-50 transition";
            }
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            const selectedRole = document.querySelector('input[name="login-role"]:checked').value;

            if (selectedRole === 'admin') {
                const pass = document.getElementById('login-password').value;
                if (pass === ADMIN_PASSWORD) {
                    currentRole = 'admin';
                    closeLoginModal();
                    renderApp();
                    showModal("¡Bienvenida Mafe!", "Has ingresado exitosamente al Panel de Reclutamiento de tu taller.");
                } else {
                    showModal("Contraseña Incorrecta", "La contraseña de administrador no es válida. Inténtalo de nuevo.");
                }
            } else {
                // Validación de Artesano por correo electrónico
                const emailInput = document.getElementById('login-email').value.trim().toLowerCase();
                
                // Si estamos en modo simulación (sin base de datos conectada)
                if (SCRIPT_URL === "TU_URL_DE_APPS_SCRIPT_AQUI") {
                    const candidate = globalData.applications.find(app => app.email.toLowerCase() === emailInput);
                    if (candidate) {
                        if (candidate.status === 'Aprobado') {
                            currentRole = 'artisan';
                            activeUserEmail = emailInput;
                            closeLoginModal();
                            renderApp();
                            showModal(`¡Bienvenido/a ${candidate.name}!`, "Tu postulación está aprobada. Ya puedes ver tus videos y actividades de inducción.");
                        } else if (candidate.status === 'Pendiente') {
                            showModal("Postulación en Revisión", `Hola ${candidate.name},\n\nHemos recibido tus datos pero Mafe aún se encuentra evaluando tus respuestas y portafolio.\n\nTe notificaremos por correo una vez seas aprobado/a.`);
                        } else {
                            showModal("Acceso Denegado", "Lo sentimos, tu postulación no ha sido aprobada para esta temporada.");
                        }
                    } else {
                        showModal("Correo no Registrado", "No encontramos ninguna postulación vinculada a este correo electrónico. Por favor, completa el formulario público primero.");
                    }
                    return;
                }

                // Si está conectado, buscamos en la base de datos descargada de Google Sheets
                const candidate = globalData.applications.find(app => app.email.toLowerCase() === emailInput);

                if (candidate) {
                    if (candidate.status === 'Aprobado') {
                        currentRole = 'artisan';
                        activeUserEmail = emailInput;
                        closeLoginModal();
                        renderApp();
                        showModal(`¡Bienvenido/a ${candidate.name}!`, "Tu postulación está aprobada. Ya puedes ver tus videos y actividades de inducción.");
                    } else if (candidate.status === 'Pendiente') {
                        showModal("Postulación en Revisión", `Hola ${candidate.name},\n\nHemos recibido tus datos pero Mafe aún se encuentra evaluando tus respuestas y portafolio.\n\nTe notificaremos por correo una vez seas aprobado/a.`);
                    } else {
                        showModal("Acceso Denegado", "Lo sentimos, tu postulación no ha sido aprobada para esta temporada.");
                    }
                } else {
                    showModal("Correo no Registrado", "No encontramos ninguna postulación vinculada a este correo electrónico. Por favor, completa el formulario público primero.");
                }
            }
        };

        window.logout = function() {
            currentRole = 'public';
            activeUserEmail = "";
            renderApp();
            showModal("Sesión Cerrada", "Has salido del área privada de forma segura.");
        };

        // --- CONEXIÓN DE BASE DE DATOS ---
        async function fetchGAS(action, payload = {}) {
            if (SCRIPT_URL === "TU_URL_DE_APPS_SCRIPT_AQUI") {
                return await mockGAS(action, payload);
            }
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (error) {
                console.error("Error en servidor:", error);
                throw new Error("Error de conexión.");
            }
        }

        async function fetchAllData() {
            try {
                const data = await fetchGAS("getAllData");
                if(data.success) {
                    globalData = data.payload;
                    if(currentRole === 'admin') loadAdminData();
                    if(currentRole === 'artisan') loadPortalData();
                }
            } catch(e) {
                console.error("Error al cargar Sheets:", e);
            }
        }

        function renderApp() {
            renderNav();
            const content = document.getElementById('app-content');
            
            if (currentRole === 'public') {
                content.innerHTML = renderPublicLanding();
                attachPublicEvents();
            } else if (currentRole === 'artisan') {
                content.innerHTML = renderInductionPortal();
                loadPortalData();
            } else if (currentRole === 'admin') {
                content.innerHTML = renderAdminDashboard();
                loadAdminData();
            }
        }

        function renderNav() {
            const navLinks = document.getElementById('nav-links');
            if (currentRole === 'public') {
                navLinks.innerHTML = `<button onclick="openLoginModal()" class="bg-brand-700 hover:bg-brand-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow"><i class="fa-solid fa-lock mr-2"></i> Ingresar</button>`;
            } else {
                navLinks.innerHTML = `
                    <span class="text-xs bg-brand-100 text-brand-800 px-3 py-1.5 rounded-full font-medium border border-brand-200">
                        ${currentRole === 'admin' ? '👑 Administrador' : '🛠 Artesano Activo'}
                    </span>
                    <button onclick="logout()" class="text-sm font-semibold text-red-600 hover:text-red-800 transition"><i class="fa-solid fa-sign-out-alt"></i> Salir</button>
                `;
            }
        }

        function renderPublicLanding() {
            return `
                <div class="fade-in max-w-4xl mx-auto">
                    <div class="text-center mb-12">
                        <h1 class="text-5xl md:text-7xl font-script text-brand-700 mb-2">Únete a Nuestro Taller</h1>
                        <p class="text-xl font-serif text-brand-600 mb-6 italic">Tienda de Accesorios</p>
                        <p class="text-base text-gray-700 max-w-2xl mx-auto font-sans leading-relaxed">Buscamos manos apasionadas y mentes creativas. Llena el siguiente formulario para postularte.</p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-brand-200">
                        <div class="bg-brand-500 text-white p-8 text-center relative overflow-hidden">
                            <h2 class="text-3xl font-serif font-semibold text-brand-50 relative z-10">Formulario de Postulación</h2>
                            <p class="text-brand-900 font-bold text-sm mt-2 uppercase tracking-widest relative z-10">Queremos conocerte y ver tu talento</p>
                        </div>
                        <form id="recruitment-form" class="p-8 space-y-6">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                                    <input type="text" id="app-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico *</label>
                                    <input type="email" id="app-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono / WhatsApp *</label>
                                    <input type="tel" id="app-phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" placeholder="+57 300 0000000">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Enlace a tu trabajo previo (Opcional)</label>
                                    <input type="url" id="app-portfolio" placeholder="https://" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                            </div>

                            <hr class="border-gray-200">
                            
                            <div>
                                <label class="block text-sm font-semibold text-brand-800 mb-1">1. ¿Tienes experiencia previa en bisutería? *</label>
                                <textarea id="app-q1" required rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-brand-800 mb-1">2. ¿Qué te apasiona de crear con tus manos? *</label>
                                <textarea id="app-q2" required rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-brand-800 mb-1">3. ¿Qué tan abierta/o estás a aprender y recibir consejos? *</label>
                                <textarea id="app-q3" required rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-brand-800 mb-1">4. ¿Por qué te gustaría trabajar con nosotros? *</label>
                                <textarea id="app-q4" required rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                            </div>

                            <div class="bg-brand-50 p-6 rounded-xl border border-brand-200 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Jornada *</label>
                                    <select id="app-availability-type" required class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                                        <option value="" disabled selected>Selecciona...</option>
                                        <option value="Completa">Tiempo Completo</option>
                                        <option value="Media Jornada">Media Jornada</option>
                                        <option value="Fines de semana">Fines de Semana</option>
                                        <option value="Flexible">Flexible</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Detalle Horario *</label>
                                    <input type="text" id="app-availability-details" required placeholder="Ej: Lunes a Viernes tardes" class="w-full px-4 py-2 border border-gray-300 bg-white rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                                </div>
                            </div>

                            <div class="pt-6">
                                <button type="submit" id="btn-submit-app" class="w-full bg-brand-700 hover:bg-brand-800 text-brand-50 font-bold py-4 px-6 rounded-lg shadow-lg transition transform hover:-translate-y-0.5 uppercase tracking-wider text-sm">
                                    Enviar Postulación
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function attachPublicEvents() {
            const form = document.getElementById('recruitment-form');
            if(form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btn-submit-app');
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando en Google Sheets...';
                    btn.disabled = true;

                    const payload = {
                        name: document.getElementById('app-name').value,
                        email: document.getElementById('app-email').value,
                        phone: document.getElementById('app-phone').value,
                        portfolio: document.getElementById('app-portfolio').value || 'N/A',
                        q1: document.getElementById('app-q1').value,
                        q2: document.getElementById('app-q2').value,
                        q3: document.getElementById('app-q3').value,
                        q4: document.getElementById('app-q4').value,
                        availType: document.getElementById('app-availability-type').value,
                        availDetails: document.getElementById('app-availability-details').value
                    };

                    try {
                        const response = await fetchGAS("submitApplication", payload);
                        
                        if(response.success) {
                            showModal('¡Postulación Recibida!', `¡Gracias ${payload.name}!\n\nTu información ha sido guardada en nuestra base de datos. Se te ha enviado un correo de bienvenida automático.`);
                            form.reset();
                            if(SCRIPT_URL !== "TU_URL_DE_APPS_SCRIPT_AQUI") fetchAllData();
                        } else {
                            throw new Error("Error del servidor");
                        }
                    } catch (error) {
                        showModal('Error', 'Hubo un problema de conexión con Google Sheets. Intenta nuevamente.');
                    } finally {
                        btn.innerHTML = 'Enviar Postulación';
                        btn.disabled = false;
                    }
                });
            }
        }

        function renderAdminDashboard() {
            return `
                <div class="fade-in">
                    <div class="mb-8">
                        <h1 class="text-3xl font-serif font-bold text-brand-800">Panel de Control de Reclutamiento</h1>
                        <p class="text-gray-600 mt-1">Conectado a Google Sheets y Gmail Automático.</p>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                        <div class="xl:col-span-2 bg-white rounded-xl shadow-md border border-brand-100 p-6">
                            <h2 class="text-xl font-bold text-brand-700 mb-4"><i class="fa-solid fa-users mr-2"></i> Postulaciones en Google Sheets</h2>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <tbody id="admin-apps-list" class="text-sm divide-y divide-gray-100">
                                        <tr><td class="text-center py-6 text-gray-400">Cargando datos...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <!-- Agregar Video -->
                            <div class="bg-white rounded-xl shadow-md border border-brand-100 p-6">
                                <h2 class="text-lg font-bold text-brand-700 mb-4"><i class="fa-solid fa-video mr-2"></i> Añadir Video de Inducción</h2>
                                <form onsubmit="adminAddVideo(event)" class="space-y-3">
                                    <input type="text" id="vid-title" placeholder="Título del Video" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none">
                                    <input type="url" id="vid-url" placeholder="URL de YouTube" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none">
                                    <button type="submit" class="w-full bg-brand-800 text-white text-sm font-semibold py-2.5 rounded">Subir Video a Sheets</button>
                                </form>
                            </div>

                            <!-- Agregar Actividad -->
                            <div class="bg-white rounded-xl shadow-md border border-brand-100 p-6">
                                <h2 class="text-lg font-bold text-brand-700 mb-4"><i class="fa-solid fa-clipboard-list mr-2"></i> Nueva Actividad</h2>
                                <form onsubmit="adminAddActivity(event)" class="space-y-3">
                                    <input type="text" id="act-title" placeholder="Título del Ejercicio" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none">
                                    <textarea id="act-inst" placeholder="Instrucciones..." required rows="3" class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none"></textarea>
                                    <button type="submit" class="w-full bg-brand-600 text-white text-sm font-semibold py-2.5 rounded">Guardar en Sheets</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadAdminData() {
            const tbody = document.getElementById('admin-apps-list');
            if(!tbody) return;

            const apps = [...globalData.applications].reverse();

            if(apps.length === 0){
                tbody.innerHTML = `<tr><td class="text-center py-8 text-gray-500">No hay postulaciones registradas en tu Google Sheet.</td></tr>`;
                return;
            }

            tbody.innerHTML = apps.map(app => `
                <tr class="hover:bg-gray-50 transition flex flex-col md:table-row">
                    <td class="p-4 align-top w-full md:w-1/3">
                        <div class="font-bold text-brand-900 text-base">${app.name}</div>
                        <div class="text-xs text-gray-500 mt-1">${app.email} | ${app.phone}</div>
                        <div class="mt-2 p-2 bg-brand-100 rounded text-xs">
                            <span class="font-bold text-brand-800">Disp: ${app.availType}</span><br>${app.availDetails}
                        </div>
                    </td>
                    <td class="p-4 text-xs text-gray-600 align-top w-full md:w-1/2 space-y-2">
                        <p><strong class="text-brand-800">Aprendizaje:</strong> ${app.q3}</p>
                        <p><strong class="text-brand-800">Por qué:</strong> ${app.q4}</p>
                    </td>
                    <td class="p-4 align-top text-center w-full md:w-1/6">
                        ${app.status === 'Pendiente' ? `
                            <button onclick="changeStatus('${app.id}', 'Aprobado')" class="bg-green-600 text-white px-3 py-1 mb-1 rounded text-xs w-full">Aprobar</button>
                            <button onclick="changeStatus('${app.id}', 'Descartado')" class="bg-red-50 text-red-600 border border-red-200 px-3 py-1 rounded text-xs w-full">Descartar</button>
                        ` : `
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${app.status === 'Aprobado' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'}">${app.status}</span>
                        `}
                    </td>
                </tr>
            `).join('');
        }

        window.changeStatus = async function(id, newStatus) {
            try {
                showModal('Actualizando', 'Sincronizando con Google Sheets...');
                await fetchGAS("updateStatus", { id, status: newStatus });
                closeModal();
                
                // Actualizar localmente para la UI
                const idx = globalData.applications.findIndex(a => a.id === id);
                if(idx > -1) globalData.applications[idx].status = newStatus;
                loadAdminData();
            } catch (e) {
                showModal('Error', 'No se pudo actualizar el estado.');
            }
        };

        window.adminAddVideo = async function(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('vid-title').value,
                url: document.getElementById('vid-url').value
            };
            const btn = e.target.querySelector('button');
            btn.innerHTML = "Guardando...";
            
            await fetchGAS("addVideo", payload);
            globalData.videos.push(payload);
            e.target.reset();
            btn.innerHTML = "Subir Video a Sheets";
            showModal('Éxito', 'Video guardado en la hoja de cálculo.');
        };

        window.adminAddActivity = async function(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('act-title').value,
                instructions: document.getElementById('act-inst').value
            };
            const btn = e.target.querySelector('button');
            btn.innerHTML = "Guardando...";

            await fetchGAS("addActivity", payload);
            globalData.activities.push(payload);
            e.target.reset();
            btn.innerHTML = "Guardar en Sheets";
            showModal('Éxito', 'Actividad guardada en la hoja de cálculo.');
        };

        function renderInductionPortal() {
            return `
                <div class="fade-in">
                    <div class="mb-10">
                        <h1 class="text-3xl font-serif font-bold text-brand-800">Portal de Inducción</h1>
                        <p class="text-gray-600 mt-2">Material obtenido desde tu Google Sheets privado.</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 space-y-6">
                            <h2 class="text-xl font-bold text-brand-700 border-b border-brand-200 pb-2"><i class="fa-brands fa-youtube text-red-500 mr-2"></i> Videos</h2>
                            <div id="artisan-videos-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                        </div>
                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-xl shadow-md border border-brand-100">
                                <h2 class="text-xl font-bold text-brand-700 mb-4">Actividades Asignadas</h2>
                                <div id="artisan-activities-container" class="space-y-4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadPortalData() {
            const vCont = document.getElementById('artisan-videos-container');
            const aCont = document.getElementById('artisan-activities-container');
            if(!vCont || !aCont) return;

            // Render Videos
            if(globalData.videos.length === 0) {
                vCont.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-xl border border-dashed border-gray-300">No hay videos en la hoja de Sheets.</div>`;
            } else {
                vCont.innerHTML = globalData.videos.map(v => {
                    const match = v.url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
                    const embedUrl = (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : v.url;
                    return `
                    <div class="bg-white rounded-xl shadow-sm border border-brand-100 overflow-hidden">
                        <div class="aspect-w-16 aspect-h-9 w-full relative pt-[56.25%] bg-gray-100">
                            <iframe class="absolute top-0 left-0 w-full h-full" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-4"><h3 class="font-semibold text-gray-800">${v.title}</h3></div>
                    </div>`
                }).join('');
            }

            // Render Actividades
            if(globalData.activities.length === 0) {
                aCont.innerHTML = `<p class="text-sm text-gray-500 italic text-center py-4 bg-gray-50 rounded-lg">No hay actividades registradas.</p>`;
            } else {
                aCont.innerHTML = globalData.activities.map(a => `
                    <div class="p-4 bg-brand-50 rounded-lg border border-brand-100">
                        <h4 class="font-bold text-sm text-brand-800">${a.title}</h4>
                        <p class="text-xs text-gray-600 mt-1">${a.instructions}</p>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // SIMULADOR LOCAL (Para cuando no hay URL de Apps Script conectada)
        // ==========================================
        async function mockGAS(action, payload) {
            return new Promise(resolve => {
                setTimeout(() => {
                    if(action === "submitApplication") {
                        payload.id = Date.now().toString();
                        payload.status = 'Pendiente';
                        globalData.applications.push(payload);
                    }
                    if(action === "addVideo") globalData.videos.push(payload);
                    if(action === "addActivity") globalData.activities.push(payload);
                    resolve({success: true, payload: globalData});
                }, 800);
            });
        }

    </script>
</body>
</html>
